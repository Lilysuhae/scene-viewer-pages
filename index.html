<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f4f5f2">
  <title>Scene Viewer</title>
  <style>
    :root {
      font-family: SUIT, Inter, system-ui, sans-serif;
      color: #232923;
      background: #f4f5f2;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      margin: 0;
      padding: 24px;
    }
    main {
      width: min(100%, 420px);
      padding: clamp(28px, 7vw, 44px);
      border: 1px solid #dfe4db;
      border-radius: 22px;
      background: #fdfefc;
      box-shadow: 0 18px 48px rgb(34 44 34 / 7%);
    }
    h1 {
      margin: 0;
      font-size: clamp(26px, 5vw, 34px);
      font-weight: 760;
      letter-spacing: -.04em;
      line-height: 1.2;
    }
    p {
      margin: 12px 0 30px;
      color: #586458;
      font-size: 15px;
      line-height: 1.65;
    }
    a {
      display: flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border-radius: 10px;
      color: #fff;
      background: #324938;
      font-size: 15px;
      font-weight: 680;
      text-decoration: none;
    }
    a:hover { background: #24382a; }
    a:focus-visible { outline: 3px solid #527a59; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Scene Viewer</h1>
    <p>ChatGPT 계정으로 로그인해 씬뷰어를 열어.</p>
    <a href="https://scene-roleplay-api-f7e04.amusedsky67.chatgpt.site/signin-with-chatgpt?return_to=%2F">ChatGPT로 로그인</a>
  </main>
</body>
</html>
